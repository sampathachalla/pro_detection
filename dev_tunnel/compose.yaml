services:
  web:
    image: node:22-bookworm
    working_dir: /workspace
    command:
      - sh
      - -lc
      - npm install && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - ../app:/workspace
      - web_node_modules:/workspace/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: handwriting.34.57.225.191.nip.io
      API_PROXY_TARGET: http://host.docker.internal:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  tunnel:
    build: .
    depends_on:
      web:
        condition: service_healthy
    environment:
      TUNNEL_HOST: 34.57.225.191
      TUNNEL_USER: pros_apps
      REMOTE_PORT: "5174"
      LOCAL_TARGET: web:5173
    volumes:
      - ${SSH_KEY_PATH:-/Users/sampath/.ssh/pros_apps}:/run/secrets/tunnel_key:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q '^ssh '"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  web_node_modules:
